<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz Interaction Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#fcf8ff",
                        "inverse-on-surface": "#f3eff9",
                        "surface-container-highest": "#e5e1eb",
                        "secondary": "#5d5d6b",
                        "on-tertiary-fixed": "#2f1500",
                        "surface-container-low": "#f6f2fc",
                        "surface": "#fcf8ff",
                        "error-container": "#ffdad6",
                        "surface-container": "#f0ecf6",
                        "on-primary-fixed": "#140067",
                        "outline-variant": "#c8c4d5",
                        "surface-dim": "#dcd8e2",
                        "tertiary-fixed": "#ffdcc3",
                        "on-primary-container": "#d1ccff",
                        "primary-fixed-dim": "#c5c0ff",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1c1b22",
                        "surface-container-high": "#ebe6f0",
                        "tertiary": "#683500",
                        "on-secondary-container": "#636371",
                        "inverse-primary": "#c5c0ff",
                        "tertiary-fixed-dim": "#ffb77d",
                        "on-surface-variant": "#474553",
                        "on-secondary-fixed-variant": "#454653",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#3f35a3",
                        "secondary-fixed-dim": "#c5c5d5",
                        "inverse-surface": "#312f37",
                        "tertiary-container": "#8a4900",
                        "primary-fixed": "#e3dfff",
                        "secondary-fixed": "#e2e1f2",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#191b26",
                        "secondary-container": "#e2e1f2",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#ffc69a",
                        "primary": "#3b309e",
                        "on-surface": "#1c1b22",
                        "on-primary": "#ffffff",
                        "primary-container": "#534ab7",
                        "surface-tint": "#584fbc",
                        "surface-bright": "#fcf8ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e5e1eb",
                        "on-error": "#ffffff",
                        "outline": "#787584",
                        "on-tertiary-fixed-variant": "#6e3900"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "base": "4px",
                        "container-padding": "20px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["22px", { "lineHeight": "1.4", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Simple radio button hide logic */
        input[type="radio"] {
            display: none;
        }
        
        input[type="radio"]:checked + div {
            border-color: #3b309e; /* primary */
            background-color: #e3dfff; /* primary-fixed */
        }
        input[type="radio"]:checked + div .icon-container {
            color: #3b309e;
        }
        input[type="radio"]:checked + div .text-container {
            color: #140067; /* on-primary-fixed */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:max-w-md md:mx-auto md:border-x md:border-outline-variant relative pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface md:max-w-md flex justify-between items-center px-container-padding h-16">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">
            완판e
        </div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform cursor-pointer" data-icon="notifications">notifications</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-container-padding flex flex-col items-center justify-center relative">
<!-- Progress Indicator -->
<div class="w-full mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-sm text-label-sm text-secondary">Question 3 of 5</span>
<span class="font-label-sm text-label-sm text-primary">60%</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 60%;"></div>
</div>
</div>
<!-- Quiz Container Bento Style -->
<div class="bg-surface-container-low w-full rounded-2xl p-6 shadow-sm border border-outline-variant/30 flex flex-col gap-6 relative z-10">
<!-- Question -->
<div class="text-center">
<div class="inline-flex items-center justify-center bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm px-3 py-1 rounded-full mb-4">
                    청약 상식
                </div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface leading-tight">
                    대학생도 청약 통장 개설이 가능한가요?
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
                    올바른 답을 선택해주세요.
                </p>
</div>
<!-- Options -->
<form class="w-full flex flex-col gap-4 mt-4" id="quiz-form">
<label class="cursor-pointer group relative">
<input name="quiz_answer" type="radio" value="A"/>
<div class="w-full bg-surface border-2 border-outline-variant rounded-xl p-4 flex items-center gap-4 transition-all duration-200 group-hover:border-primary-fixed-dim">
<div class="icon-container w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="calendar_today">calendar_today</span>
</div>
<div class="text-container flex-grow text-on-surface transition-colors">
<span class="block font-body-lg text-body-lg font-bold">네, 언제든지 가능해요</span>
</div>
</div>
</label>
<label class="cursor-pointer group relative">
<input name="quiz_answer" type="radio" value="B"/>
<div class="w-full bg-surface border-2 border-outline-variant rounded-xl p-4 flex items-center gap-4 transition-all duration-200 group-hover:border-primary-fixed-dim">
<div class="icon-container w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="school">school</span>
</div>
<div class="text-container flex-grow text-on-surface transition-colors">
<span class="block font-body-lg text-body-lg font-bold">아니요, 졸업 후부터 가능해요</span>
</div>
</div>
</label>
</form>
</div>
<!-- Decorative Elements behind the bento box -->
<div class="absolute -top-10 -right-4 w-32 h-32 bg-primary-fixed-dim/20 rounded-full blur-2xl -z-10 pointer-events-none"></div>
<div class="absolute bottom-20 -left-10 w-40 h-40 bg-tertiary-fixed-dim/20 rounded-full blur-3xl -z-10 pointer-events-none"></div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full md:max-w-md bg-surface p-4 border-t border-outline-variant/30 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 flex items-center justify-center">
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-bold py-4 rounded-[10px] transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg" disabled="" id="submit-btn">
            정답 제출하기
        </button>
</div>
<!-- Script to handle button state -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('quiz-form');
            const submitBtn = document.getElementById('submit-btn');
            const radios = form.querySelectorAll('input[type="radio"]');

            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    submitBtn.disabled = false;
                });
            });
            
            submitBtn.addEventListener('click', () => {
                const selected = form.querySelector('input[name="quiz_answer"]:checked');
                if(selected) {
                    // Micro-interaction for submit
                    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                    setTimeout(() => {
                        submitBtn.innerHTML = '제출 완료!';
                        submitBtn.classList.replace('bg-primary', 'bg-tertiary-container');
                    }, 1000);
                }
            });
        });
    </script>
</body></html>
