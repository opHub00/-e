<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F3AA8" />
    <title>완판e · 연결 확인</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fcf8ff;
        color: #1f1b2d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 390px); text-align: center; }
      .mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #4f3aa8;
        color: #fff;
        font-size: 22px;
        font-weight: 800;
      }
      h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.35; }
      p { margin: 0; color: #676273; font-size: 15px; line-height: 1.65; }
      button {
        width: 100%;
        min-height: 52px;
        margin-top: 28px;
        border: 0;
        border-radius: 14px;
        background: #4f3aa8;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #a99af2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">e</div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>청약 공고와 AI 기능은<br />인터넷 연결이 필요해요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
