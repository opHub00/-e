<!-- Main Content Canvas -->
<main class="w-full max-w-md px-container-padding pt-32 pb-40 flex-grow">
<!-- Headline -->

<!-- Bento Grid Form Sections -->
<div class="grid grid-cols-1 gap-gutter">
<!-- Income Field -->

<div class="flex items-center gap-2 mb-4">

</div>
<div class="relative">

<span class="absolute right-4 top-1/2 -translate-y-1/2 font-label-md text-on-surface-variant">만원</span>
</div>
</section>
<!-- Family Counter -->
<section class="bg-secondary-container p-6 rounded-xl bento-card border border-transparent">
<div class="flex items-center justify-between">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary">groups</span>

</div>

</div>
<div class="flex items-center bg-surface rounded-full p-1 shadow-sm">
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-primary/5 rounded-full transition-colors" onclick="decrement('family-count')">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-12 text-center font-headline-md text-headline-md text-on-surface" id="family-count">1</span>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-primary/5 rounded-full transition-colors" onclick="increment('family-count')">

</section>
<!-- Region Selector -->

<button class="w-full bg-primary text-on-primary font-label-md text-headline-md py-4 rounded-xl shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            다음으로 넘어가기
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script>
        function increment(id) {
            const el = document.getElementById(id);
            let val = parseInt(el.innerText);
            el.innerText = val + 1;
        }

        function decrement(id) {
            const el = document.getElementById(id);
            let val = parseInt(el.innerText);
            if (val > 1) el.innerText = val - 1;
        }

        // Chip selection logic
        document.querySelectorAll('.chip-btn').forEach(btn => {
            const updateStyles = () => {
                const isSelected = btn.getAttribute('data-selected') === 'true';
                if (isSelected) {
                    btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                    btn.classList.remove('bg-surface', 'text-on-surface', 'border-outline-variant');
                } else {
                    btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    btn.classList.add('bg-surface', 'text-on-surface', 'border-outline-variant');
                }
            };

            updateStyles();

            btn.addEventListener('click', () => {
                const isSelected = btn.getAttribute('data-selected') === 'true';
                btn.setAttribute('data-selected', !isSelected);
                updateStyles();
            });
        });

        // Simple scroll reveal for the mascot
        window.addEventListener('scroll', () => {
            const mascot = document.querySelector('.mt-12');
            const pos = mascot.getBoundingClientRect().top;
            if (pos < window.innerHeight) {
                mascot.style.opacity = '1';
                mascot.style.transform = 'translateY(0)';
            }
        });
        
        // Initial state for mascot animation
        const mascot = document.querySelector('.mt-12');
        mascot.style.opacity = '0';
        mascot.style.transform = 'translateY(20px)';
        mascot.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
        setTimeout(() => {
            mascot.style.opacity = '1';
            mascot.style.transform = 'translateY(0)';
        }, 300);
    </script>
